kind = "mobile"
previewPath = "/"
title = "Solar Monitor"
description = "Une application mobile qui permet de suivre la consommation et la production d’électricité des panneaux solaires à partir de l’API du propriétaire, avec un aperçu quotidien et l’historique des mesures."
version = "1.0.0"
id = "artifacts/solar-monitor"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25769

[services.development]
run = "pnpm --filter @workspace/solar-monitor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solar-monitor", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/solar-monitor", "run", "serve" ]

[services.env]
PORT = "25769"
BASE_PATH = "/"
